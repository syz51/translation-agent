[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "translation-agent"
version = "0.1.0"
description = "Workflow-first translation agent bootstrap"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"psycopg[binary]>=3.2.0,<4.0.0",
	"pydantic>=2.11.0,<3.0.0",
	"pydantic-settings>=2.11.0,<3.0.0",
]

[project.scripts]
translation-agent = "translation_agent.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: marks tests that require Docker-backed Postgres"]
