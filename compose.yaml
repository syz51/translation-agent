services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${TA_PG_DB:-translation_agent}
      POSTGRES_USER: ${TA_PG_USER:-translation_agent}
      POSTGRES_PASSWORD: ${TA_PG_PASSWORD:-translation_agent}
    ports:
      - '${TA_PG_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${TA_PG_USER:-translation_agent} -d ${TA_PG_DB:-translation_agent}',
        ]
      interval: 1s
      timeout: 5s
      retries: 30
  migrate:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TA_STATE_DB_DSN: postgresql://${TA_PG_USER:-translation_agent}:${TA_PG_PASSWORD:-translation_agent}@postgres:5432/${TA_PG_DB:-translation_agent}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
      - app-venv:/opt/translation-agent/.venv
    command:
      [
        'sh',
        '-lc',
        'uv sync --frozen && uv run translation-agent migrate-db',
      ]
  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      TA_STATE_DB_DSN: postgresql://${TA_PG_USER:-translation_agent}:${TA_PG_PASSWORD:-translation_agent}@postgres:5432/${TA_PG_DB:-translation_agent}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - uv-cache:/root/.cache/uv
      - app-venv:/opt/translation-agent/.venv
    command:
      [
        'sh',
        '-lc',
        'uv sync --frozen && uv run translation-agent validate-config && tail -f /dev/null',
      ]

volumes:
  postgres-data:
  uv-cache:
  app-venv:
